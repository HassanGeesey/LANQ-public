name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --clean --noconfirm lanq.spec

      - name: Name artifact with tag
        run: Copy-Item "dist/LANQ.exe" "dist/LANQ-${{ github.ref_name }}.exe"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer/LANQ.iss

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LANQ-*.exe
            dist/installer/LANQ-Setup-*.exe
          generate_release_notes: true
